name: Publish to PyPI

# Uses PyPI Trusted Publishing (no API token stored in GitHub).
# One-time setup on pypi.org: Project -> Publishing -> add a GitHub publisher
#   owner: udityamerit
#   repo:  Text-Processing-Package-For-Natural-Language-Processing
#   workflow: publish.yml
#   environment: pypi
# Then create a repository variable TRUSTED_PUBLISHING=true (Settings -> Secrets and
# variables -> Actions -> Variables). Until it is set the publish job is skipped, so
# releases uploaded by hand with twine do not show a failed run. See RELEASING.md.
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: ${{ vars.TRUSTED_PUBLISHING == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
