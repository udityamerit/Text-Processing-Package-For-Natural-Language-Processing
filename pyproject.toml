[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nlp-text-preprocessing"
dynamic = ["version"]
description = "Text cleaning, feature extraction and linguistic utilities for NLP and ML pipelines"
readme = "Readme.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Uditya Narayan Tiwari", email = "tiwarimerit@gmail.com" }]
keywords = ["nlp", "text-preprocessing", "text-cleaning", "spacy", "nltk", "textblob"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
# Dependencies the package genuinely uses. (pyaudio, SpeechRecognition,
# openpyxl, PrettyTable, scikit-learn and numpy were listed before but are
# never imported by the code.)
dependencies = [
    "spacy",
    "textblob",
    "nltk",
    "beautifulsoup4",
    "lxml",
    "emoji>=2.0",
    "langdetect",
]

[project.optional-dependencies]
pandas = ["pandas"]
viz = ["wordcloud", "matplotlib"]
sklearn = ["scikit-learn"]
transformers = ["transformers"]
all = ["pandas", "wordcloud", "matplotlib", "scikit-learn"]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "build", "twine", "pandas", "wordcloud", "matplotlib", "scikit-learn"]

[project.scripts]
nlp-prep = "nlp_text_preprocessing.cli:main"

[project.urls]
Homepage = "https://github.com/udityamerit/Text-Processing-Package-For-Natural-Language-Processing"
Documentation = "https://github.com/udityamerit/Text-Processing-Package-For-Natural-Language-Processing/blob/main/examples/NLP_Text_Preprocessing_Complete_Guide.ipynb"
"Source Code" = "https://github.com/udityamerit/Text-Processing-Package-For-Natural-Language-Processing"
"Bug Tracker" = "https://github.com/udityamerit/Text-Processing-Package-For-Natural-Language-Processing/issues"
"Author Website" = "https://udityanarayantiwari.netlify.app/"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["nlp_text_preprocessing*"]

[tool.setuptools.package-data]
nlp_text_preprocessing = ["data/*.json", "py.typed"]

[tool.setuptools.dynamic]
version = { attr = "nlp_text_preprocessing.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["nlp_text_preprocessing"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = ["examples", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E701", "E702", "E731", "E741"]

[tool.ruff.lint.per-file-ignores]
"nlp_text_preprocessing/__init__.py" = ["F403", "F405"]

[tool.mypy]
ignore_missing_imports = true
files = ["nlp_text_preprocessing"]
